# Integration register — Insurer Oracle estate (state as of 2023; not the current state)
# Source: finance-technology notebook 2020–2023 [CO:INS-NB]. Interfaces are known by name; no production numbers.
schema: {id: str, name: str, source: str, target: str, direction: in|out|internal, lane: str, cadence: str, workstream: str, notes: str, evidence: str}

groups:

    - {id: INS-BUDGET-GL, name: Planning budgets and statistical journals to GL budget balances, source: EPM Planning, target: Oracle GL, direction: in, lane: EPM Data Management, cadence: per budget cycle, workstream: R2R, evidence: "CO:INS-NB p.424–426, 499"}

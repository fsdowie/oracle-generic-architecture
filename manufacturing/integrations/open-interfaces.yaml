# Open interfaces — generic food & beverage manufacturer (FBCo) on Oracle Fusion Cloud 26C
# Generic reference: no client data. Each row is an Oracle open interface table, the way data is loaded into it
# (FBDI template, REST resource or spreadsheet), and the scheduled process that imports it into the module.
# Evidence: ORA26C:<guide> p.<pdf page>. Names that are standard Oracle objects but are not printed in the
# guides provided are tagged INFERRED and listed in manufacturing/open-questions.md.
schema: {id: str, name: str, table: str, source: str, target: str, direction: in, lane: str, cadence: "import process", workstream: str, notes: str, evidence: str}

groups:
  master-data:
    - {id: OI-GL-SEGVAL, name: Chart of accounts segment values, table: GL_SEGMENT_VALUES_INTERFACE, source: Segment values and hierarchies FBDI, target: "General Ledger (value sets)", direction: in, lane: FBDI, cadence: Import Segment Values and Hierarchies, workstream: MDM, evidence: "ORA26C:implementing-enterprise-structures-and-general-ledger p.90, 246", rest: "no direct resource; the file through erpintegrations (importBulkData)"}
    - {id: OI-GL-SEGHIER, name: "Account hierarchies (tree versions)", table: GL_SEGMENT_HIER_INTERFACE, source: Segment values and hierarchies FBDI, target: "General Ledger (trees)", direction: in, lane: FBDI, cadence: Import Segment Values and Hierarchies, workstream: MDM, evidence: "ORA26C:implementing-enterprise-structures-and-general-ledger p.246-247", rest: "no direct resource; the file through erpintegrations (importBulkData)"}
    - {id: OI-GL-CCID, name: Account combinations, table: GL_BULK_COMBINATIONS_INT, source: Account combinations FBDI, target: "General Ledger (code combinations)", direction: in, lane: FBDI, cadence: Import Account Combinations, workstream: MDM, evidence: "ORA26C:implementing-enterprise-structures-and-general-ledger p.274", rest: "no direct resource; the file through erpintegrations (importBulkData)"}
    - {id: OI-GL-CVR, name: Cross-validation rules, table: GL_CROSS_VALIDATION_RULES_INT, source: Cross-validation rules FBDI, target: General Ledger, direction: in, lane: FBDI, cadence: Import Cross-Validation Rules, workstream: MDM, evidence: "ORA26C:implementing-enterprise-structures-and-general-ledger p.90", rest: "no direct resource; the file through erpintegrations (importBulkData)"}
    - {id: OI-GL-COAMAP, name: "Chart of accounts mapping rules (corporate → Mexican statutory chart)", table: GL_COA_MAP_SEGMENT_RULES_INT, source: Chart of accounts mapping rules FBDI, target: "General Ledger (secondary ledger mapping)", direction: in, lane: FBDI, cadence: Import Chart of Accounts Mapping Rules, workstream: MDM, notes: Rollup rules load through GL_COA_MAP_ROLLUP_RULES_INT, evidence: "ORA26C:implementing-enterprise-structures-and-general-ledger p.111", rest: "no direct resource; the file through erpintegrations (importBulkData)"}
    - {id: OI-SUPP, name: Suppliers, table: POZ_SUPPLIERS_INT, source: Supplier import FBDI, target: Suppliers, direction: in, lane: FBDI, cadence: Import Suppliers, workstream: MDM, evidence: "ORA26C:implementing-procurement p.915-916", rest: "POST suppliers, or the file through erpintegrations (importBulkData)"}
    - {id: OI-SUPP-SITE, name: "Supplier sites, addresses, contacts and site assignments", table: POZ_SUPPLIER_SITES_INT, source: Supplier import FBDI, target: Suppliers, direction: in, lane: FBDI, cadence: "Import Supplier Sites (and Addresses, Contacts, Site Assignments)", workstream: MDM, notes: "Companion tables POZ_SUP_ADDRESSES_INT, POZ_SUP_CONTACTS_INT, POZ_SITE_ASSIGNMENTS_INT", evidence: "ORA26C:implementing-procurement p.915-916", rest: "POST suppliers/{SupplierId}/child/sites, or the file through erpintegrations (importBulkData)"}
    - {id: OI-CUST-PROF, name: "Customer profiles, bank accounts and payment methods", table: RA_CUSTOMER_PROFILES_INT_ALL, source: Customer import FBDI, target: "Receivables (customers)", direction: in, lane: FBDI, cadence: "Import Customers (customer profile import)", workstream: MDM, notes: "Companion tables RA_CUSTOMER_BANKS_INT_ALL, RA_CUST_PAY_METHOD_INT_ALL", evidence: "ORA26C:implementing-receivables-credit-to-cash p.140, 285-287", rest: "createCustomer (Order Management) for real-time customers, or the file through erpintegrations (importBulkData)"}
    - {id: OI-ITEM, name: "Items (finished goods, ingredients, packaging)", table: EGP_SYSTEM_ITEMS_INTERFACE, source: Item import FBDI, target: Product Hub / Item master, direction: in, lane: FBDI, cadence: Item Import, workstream: MDM, notes: Table name INFERRED; the Item Import task is in the guide, evidence: "ORA26C:implementing-common-features-for-scm p.526, 531; INFERRED", rest: "POST items (Items Version 2), or the file through erpintegrations (importBulkData)"}
    - {id: OI-STDCOST, name: Standard costs, table: CST_INTERFACE_STD_COSTS, source: Standard cost import FBDI, target: "Cost Management (cost books)", direction: in, lane: FBDI, cadence: Standard Cost Import, workstream: MDM, notes: Errors are worked on the Manage Standard Cost Import Exceptions page. Table name INFERRED, evidence: "ORA26C:implementing-manufacturing-and-supply-chain-materials-management p.359; INFERRED", rest: "POST standardCosts, or the file through erpintegrations (importBulkData)"}
  procure-to-pay:
    - {id: OI-REQ, name: Purchase requisitions, table: POR_REQ_HEADERS_INTERFACE_ALL, source: Requisition import FBDI, target: Self Service Procurement, direction: in, lane: FBDI, cadence: Import Requisitions, workstream: P2P, notes: Lines through POR_REQ_LINES_INTERFACE_ALL. Table names INFERRED, evidence: INFERRED, rest: "POST purchaseRequisitions, or the file through erpintegrations (importBulkData)"}
    - {id: OI-PO, name: Purchase orders, table: PO_HEADERS_INTERFACE, source: Purchase order import FBDI, target: Purchasing, direction: in, lane: FBDI, cadence: Import Orders, workstream: P2P, notes: "Lines, schedules and distributions through PO_LINES_INTERFACE, PO_LINE_LOCATIONS_INTERFACE, PO_DISTRIBUTIONS_INTERFACE. Table names INFERRED", evidence: INFERRED, rest: "POST draftPurchaseOrders, then purchaseOrders actions (communicate, close, cancel), or the file through erpintegrations (importBulkData)"}
    - {id: OI-RCV, name: "Receipts (ASN, receive, inspect, put away)", table: RCV_TRANSACTIONS_INTERFACE, source: Receiving receipt FBDI or REST, target: Receiving, direction: in, lane: FBDI / REST, cadence: Receiving Transaction Manager, workstream: P2P, notes: Header RCV_HEADERS_INTERFACE; lots INV_TRANSACTION_LOTS_INTERFACE; serials INV_SERIAL_NUMBERS_INTERFACE, evidence: "ORA26C:using-receiving p.108", rest: "POST receivingReceiptRequests (receipts and ASNs), or the file through erpintegrations (importBulkData)"}
    - {id: OI-APINV, name: Supplier invoices, table: AP_INVOICES_INTERFACE, source: "Payables invoice FBDI, REST or imaging", target: Payables, direction: in, lane: FBDI / REST, cadence: Import Payables Invoices, workstream: P2P, notes: "Lines through AP_INVOICE_LINES_INTERFACE; matched to PO, receipt or consumption advice", evidence: "ORA26C:implementing-payables-invoice-to-pay p.75, 127", rest: "POST invoices (action validateInvoice), or the file through erpintegrations (importBulkData)"}
  plan-to-produce:
    - {id: OI-WO, name: "Work orders (header, operations, materials, resources, outputs)", table: WIE_WORK_ORDERS_INT, source: Work order import FBDI, target: Manufacturing, direction: in, lane: FBDI, cadence: Import Work Orders, workstream: P2M, notes: "Supply Chain Orchestration and planning release work orders through the same import. Interface table name INFERRED; target tables WIE_WORK_ORDERS, WIE_WO_OPERATION_MATERIALS, WIE_WO_OPERATION_RESOURCES, WIE_WO_OPERATION_OUTPUTS", evidence: "ORA26C:implementing-manufacturing-and-supply-chain-materials-management p.548, 664; INFERRED", rest: "POST processWorkOrders, or the file through erpintegrations (importBulkData)"}
    - {id: OI-WO-OPTXN, name: "Work order operation transactions (move, complete)", table: WIE_OPERATION_TRANSACTIONS, source: Manufacturing execution system or REST, target: Manufacturing, direction: in, lane: REST / FBDI, cadence: Import Work Order Transactions, workstream: P2M, evidence: "ORA26C:implementing-manufacturing-and-supply-chain-materials-management p.478, 664", rest: "POST operationTransactions, or the file through erpintegrations (importBulkData)"}
    - {id: OI-WO-RESTXN, name: "Work order resource transactions (labor, machine hours)", table: WIE_RESOURCE_TRANSACTIONS, source: Time capture or MES, target: Manufacturing, direction: in, lane: REST / FBDI, cadence: Import Work Order Transactions, workstream: P2M, evidence: "ORA26C:implementing-manufacturing-and-supply-chain-materials-management p.478, 664", rest: "POST resourceTransactions, or the file through erpintegrations (importBulkData)"}
    - {id: OI-INVTXN, name: "Inventory transactions (issues, receipts, transfers, adjustments)", table: INV_TRANSACTIONS_INTERFACE, source: "Inventory transaction FBDI, REST or scanners", target: Inventory Management, direction: in, lane: FBDI / REST, cadence: "Manage Inventory Transactions (pending transactions)", workstream: P2M, notes: "Lots through INV_TRANSACTION_LOTS_INTERFACE (lot number, expiration date). Table name INFERRED", evidence: "ORA26C:using-receiving p.108; INFERRED", rest: "POST inventoryStagedTransactions (action processByHeader), or the file through erpintegrations (importBulkData)"}
  order-to-cash:
    - {id: OI-SO, name: "Sales orders (EDI, portal, legacy)", table: DOO_ORDER_HEADERS_ALL_INT, source: Sales order import FBDI or REST, target: Order Management, direction: in, lane: FBDI / REST, cadence: "Load Interface File for Import, then Import Sales Orders", workstream: O2C, notes: "SourceSalesOrderImportTemplate.xlsm; lines and addresses through DOO_ORDER_LINES_ALL_INT and DOO_ORDER_ADDRESSES_INT. REST: Sales Orders for Order Hub. Delete Orders from Interface Tables clears loaded rows", evidence: "ORA26C:implementing-order-management p.36, 58, 233, 265-266", rest: "POST salesOrdersForOrderHub (actions applyHold, releaseHold, splitFulfillmentLine), or the file through erpintegrations (importBulkData)"}
    - {id: OI-SHIP, name: Shipment lines from a 3PL or warehouse system, table: WSH_DEL_DETAILS_INTERFACE, source: Shipment request / confirm integration, target: Shipping, direction: in, lane: REST / FBDI, cadence: Ship Confirm, workstream: O2C, notes: Reservations through INV_RESERVATION_INTERFACE, evidence: "ORA26C:using-shipping p.69", rest: "POST shipmentTransactionRequests (action shipmentActions), or the file through erpintegrations (importBulkData)"}
    - {id: OI-ARINV, name: Customer invoices and credit memos, table: RA_INTERFACE_LINES_ALL, source: "Order Management (fulfilled lines) or AutoInvoice FBDI", target: Receivables, direction: in, lane: FBDI / internal, cadence: Import AutoInvoice, workstream: O2C, notes: Distributions through RA_INTERFACE_DISTRIBUTIONS_ALL, evidence: "ORA26C:implementing-receivables-credit-to-cash p.80-84, 105", rest: "POST receivablesInvoices; review loaded rows with autoInvoiceInterfaceLines; the file through erpintegrations (importBulkData)"}
    - {id: OI-LOCKBOX, name: Customer payments from the bank lockbox, table: AR_PAYMENTS_INTERFACE_ALL, source: Bank lockbox file, target: Receivables, direction: in, lane: File, cadence: Process Receipts Through Lockbox, workstream: O2C, evidence: "ORA26C:implementing-receivables-credit-to-cash p.174, 181, 203", rest: "POST standardReceipts (action applyReceipt), or the file through erpintegrations (importBulkData)"}
  record-to-report:
    - {id: OI-GL-JE, name: Journals from feeder systems and spreadsheets, table: GL_INTERFACE, source: Journal import FBDI or ADFdi spreadsheet, target: General Ledger, direction: in, lane: FBDI / Spreadsheet, cadence: Import Journals, workstream: R2R, evidence: "ORA26C:implementing-enterprise-structures-and-general-ledger p.568", rest: "no create resource (journalBatches is read, update and delete); the file through erpintegrations (importBulkData)"}
    - {id: OI-GL-RATES, name: "Daily conversion rates (MXN/USD)", table: GL_DAILY_RATES_INTERFACE, source: Rates provider or spreadsheet, target: General Ledger, direction: in, lane: Spreadsheet / REST, cadence: Import Daily Rates, workstream: R2R, evidence: "ORA26C:implementing-enterprise-structures-and-general-ledger p.293", rest: "currencyRates is read-only; the file through erpintegrations (importBulkData)"}
    - {id: OI-GL-HIST, name: Historical rates for equity translation, table: GL_HISTORICAL_RATES_INT, source: Historical rates FBDI, target: General Ledger, direction: in, lane: FBDI, cadence: Import Historical Rates, workstream: R2R, evidence: "ORA26C:implementing-enterprise-structures-and-general-ledger p.296", rest: "no direct resource; the file through erpintegrations (importBulkData)"}
    - {id: OI-GL-BUD, name: Budget balances, table: GL_BUDGET_INTERFACE, source: Budget FBDI or EPM Planning, target: "General Ledger (budget balances)", direction: in, lane: FBDI, cadence: Import General Ledger Budget Balances, workstream: R2R, evidence: "ORA26C:implementing-enterprise-structures-and-general-ledger p.667-670", rest: "no direct resource; the file through erpintegrations (importBulkData)"}
    - {id: OI-FA-ADD, name: Asset additions from Payables and FBDI, table: FA_MASS_ADDITIONS, source: "Payables (Create Mass Additions) or FBDI", target: Fixed Assets, direction: in, lane: Internal / FBDI, cadence: Post Mass Additions, workstream: R2R, notes: "Create Mass Additions (Payables) places invoice lines here; assets can also come from Receiving. Prepare Source Lines spreadsheet before posting", evidence: "ORA26C:using-assets p.7, 15, 18", rest: "no Fixed Assets resource in the 26C Financials REST catalogue; the file through erpintegrations (importBulkData)"}
    - {id: OI-CE-STMT, name: "Bank statements (BAI2, CAMT.053)", table: CE_STATEMENT_HEADERS_INT, source: Bank file, target: Cash Management, direction: in, lane: File, cadence: "Load the bank statement file, then run reconciliation", workstream: R2R, notes: "Lines through CE_STATEMENT_LINES_INT. Matching by reconciliation matching rules. Table names INFERRED (no Fusion Cash Management guide in the set)", evidence: "ORA26C:getting-started-with-your-financials-implementation p.197; ORA26C:implementing-receivables-credit-to-cash p.353; INFERRED", rest: "no bank statement resource; cashExternalTransactions covers external cash transactions; the file through erpintegrations (importBulkData)"}

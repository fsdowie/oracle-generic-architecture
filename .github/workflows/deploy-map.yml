name: Deploy estate map

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "integrations/integration-register.yaml"
      - "tools/build_map_data.py"
      - ".github/workflows/deploy-map.yml"
  workflow_dispatch:

concurrency:
  group: deploy-map
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the browser key is the anon key
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # config.js is public, so the key written into it must never grant more than anon.
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "SUPABASE_ANON_KEY is empty"; exit 1; fi
          if [ "$SUPABASE_ANON_KEY" = "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_ANON_KEY is the same as SUPABASE_SERVICE_ROLE_KEY"; exit 1; fi
          case "$SUPABASE_ANON_KEY" in
            sb_publishable_*) echo "Publishable key: OK" ;;
            sb_secret_*) echo "SUPABASE_ANON_KEY is a secret key"; exit 1 ;;
            eyJ*)
              p=$(echo "$SUPABASE_ANON_KEY" | cut -d. -f2 | tr '_-' '/+')
              while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
              role=$(echo "$p" | base64 -d | python3 -c 'import json,sys; print(json.load(sys.stdin).get("role",""))')
              if [ "$role" != "anon" ]; then echo "SUPABASE_ANON_KEY has role '$role', expected 'anon'"; exit 1; fi
              echo "JWT role anon: OK" ;;
            *) echo "SUPABASE_ANON_KEY is not a recognised Supabase key"; exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate knowledge pack
        run: |
          pip install pyyaml
          python tools/validate_pack.py

      - name: Build map data
        run: python tools/build_map_data.py

      - name: Upload map data to private Supabase bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # New sb_secret_ keys are not JWTs: send them in the apikey header only.
          auth=()
          case "$SUPABASE_SERVICE_ROLE_KEY" in
            sb_*) ;;
            *) auth=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY") ;;
          esac
          status=$(curl -sS -o /tmp/upload.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/storage/v1/object/estate-map/map.json" \
            "${auth[@]}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/json" \
            --data-binary @build/map.json)
          echo "Supabase responded $status"
          if [ "$status" -ge 300 ]; then cat /tmp/upload.txt; exit 1; fi

      - name: Write public config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > site/public/config.js <<EOF
          window.MAP_CONFIG = { url: "${SUPABASE_URL}", anonKey: "${SUPABASE_ANON_KEY}", bucket: "estate-map", object: "map.json" };
          EOF

      - name: Check nothing sensitive is in the deploy folder
        run: |
          if ls site/public | grep -qiE '\.(md|yaml|yml)$|map\.json'; then
            echo "Refusing to deploy: content files found in site/public"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy site/public --prod --yes --token "$VERCEL_TOKEN"

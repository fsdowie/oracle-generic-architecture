name: Deploy estate map

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "integrations/integration-register.yaml"
      - "tools/build_map_data.py"
      - ".github/workflows/deploy-map.yml"
  workflow_dispatch:

concurrency:
  group: deploy-map
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate knowledge pack
        run: |
          pip install pyyaml
          python tools/validate_pack.py

      - name: Build map data
        run: python tools/build_map_data.py

      - name: Upload map data to private Supabase bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          status=$(curl -sS -o /tmp/upload.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/storage/v1/object/estate-map/map.json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/json" \
            --data-binary @build/map.json)
          echo "Supabase responded $status"
          if [ "$status" -ge 300 ]; then cat /tmp/upload.txt; exit 1; fi

      - name: Write public config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > site/public/config.js <<EOF
          window.MAP_CONFIG = { url: "${SUPABASE_URL}", anonKey: "${SUPABASE_ANON_KEY}", bucket: "estate-map", object: "map.json" };
          EOF

      - name: Check nothing sensitive is in the deploy folder
        run: |
          if ls site/public | grep -qiE '\.(md|yaml|yml)$|map\.json'; then
            echo "Refusing to deploy: content files found in site/public"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy site/public --prod --yes --token "$VERCEL_TOKEN"
